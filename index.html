<body>
<div id="ned" role="img" aria-label="Ned"></div>
<script>
// URL angle: ?180, ?90, ?270 or ?angle=180. Default: 0 degrees.
const raw=location.search.slice(1);
const match=raw.match(/(?:^|&)angle=(-?\d+(?:\.\d+)?)/i);
const angleText=match?match[1]:raw.split('&')[0];
let angle=Number(angleText);
if(!Number.isFinite(angle)) angle=0;
angle=((angle%360)+360)%360;
// 120 baked render frames, one every 3 degrees.
const frame=Math.round(angle/3)%120;
const col=frame%10;
const row=Math.floor(frame/10);
const x=col/9*100;
const y=row/11*100;
document.getElementById('ned').style.backgroundPosition=`${x}% ${y}%`;
</script>
