modelRoot.rotation.set(
 THREE.MathUtils.degToRad(Number.isFinite(initialX)?initialX:0),
 THREE.MathUtils.degToRad(Number.isFinite(initialY)?initialY:0),
 THREE.MathUtils.degToRad(Number.isFinite(initialZ)?initialZ:0)
);

// Rotación interactiva: arrastra con mouse o dedo.
let dragging=false, lastX=0, lastY=0;
renderer.domElement.style.cursor='grab';
renderer.domElement.style.touchAction='none';
renderer.domElement.addEventListener('pointerdown',e=>{
 dragging=true; lastX=e.clientX; lastY=e.clientY;
 renderer.domElement.setPointerCapture(e.pointerId);
 renderer.domElement.style.cursor='grabbing';
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!dragging)return;
 const dx=e.clientX-lastX, dy=e.clientY-lastY;
 modelRoot.rotation.y += dx*0.01;
 modelRoot.rotation.x += dy*0.01;
 lastX=e.clientX; lastY=e.clientY;
});
function stopDragging(){
 dragging=false;
 renderer.domElement.style.cursor='grab';
}
renderer.domElement.addEventListener('pointerup',stopDragging);
renderer.domElement.addEventListener('pointercancel',stopDragging);
renderer.domElement.addEventListener('lostpointercapture',stopDragging);

function easing(name,t){
 if(name==='easeInOutQuad')return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
 if(name==='easeInElastic'){const c=2*Math.PI/3;return t===0?0:t===1?1:-Math.pow(2,10*t-10)*Math.sin((t*10-10.75)*c);}
 return t;
}
function valueAt(channel,time){
 const keys=Object.entries(channel).map(([t,val])=>[Number(t),val]).sort((a,b)=>a[0]-b[0]);
 if(time<=keys[0][0])return Array.isArray(keys[0][1])?keys[0][1]:(keys[0][1].post?.vector||keys[0][1].vector);
 for(let i=0;i<keys.length-1;i++){
  const [t0,a]=keys[i],[t1,b]=keys[i+1];
  if(time<=t1){
   let p=(time-t0)/(t1-t0);
   const va=Array.isArray(a)?a:(a.post?.vector||a.vector);
   const vb=Array.isArray(b)?b:(b.pre?.vector||b.vector);
   return va.map((v,j)=>v+(vb[j]-v)*p);
  }
 }
 const last=keys[keys.length-1][1];
 return Array.isArray(last)?last:(last.post?.vector||last.vector);
}
function animate(t){
 for(const [name,channels] of Object.entries(idle.bones)){
  const bone=bones[name];if(!bone)continue;
  bone.rotation.copy(baseRot[name]);
  if(channels.rotation){
   let r=valueAt(channels.rotation,t);
   // Gentle continuous head sway: no abrupt stop between turns.
   if(name==='head'){
    const phase=(t/8)*Math.PI*2;
    r=[0, Math.sin(phase)*1.25, Math.sin(phase+Math.PI/2)*0.18];
   }
   // Restore the outward lower-arm spread without changing the shoulder position.
   if(name==='left_arm'||name==='right_arm') r[2] *= -1;
   bone.rotation.set(
    baseRot[name].x+THREE.MathUtils.degToRad(r[0]),
    baseRot[name].y+THREE.MathUtils.degToRad(r[1]),
    baseRot[name].z+THREE.MathUtils.degToRad(r[2])
   );
  }
 }
}
const duration=idle.animation_length||3;
const start=performance.now();
function render(now){
 const t=((now-start)/1000)%duration;
 animate(t);
 renderer.render(scene,camera);
 requestAnimationFrame(render);
}
requestAnimationFrame(render);
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
