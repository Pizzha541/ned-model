<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#121116">
<title>Ned</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
body{display:grid;place-items:center}
#ned{width:min(100vw,100vh,640px);aspect-ratio:1/1;background-image:url('./ned_idle_angles_sprite.webp');background-repeat:no-repeat;background-size:2400% 3200%;image-rendering:pixelated}
</style>
</head>
<body>
<div id="ned" role="img" aria-label="Ned"></div>
<script>
// Fixed view from URL: ?15, ?45, ?180 or ?angle=45.
// Any value snaps to the nearest 15-degree view.
const COLS=24, IDLE_FRAMES=32, IDLE_DURATION=4000;
const params=new URLSearchParams(location.search);
const raw=location.search.slice(1).split('&')[0];
const angleInput=params.has('angle')?Number(params.get('angle')):Number(raw);
const requested=Number.isFinite(angleInput)?angleInput:0;
const normalized=((requested%360)+360)%360;
const snapped=((Math.round(normalized/15)*15)%360+360)%360;
const angleColumn=Math.round(snapped/15)%COLS;
const element=document.getElementById('ned');
let lastRow=-1;
function showFrame(row){const x=(angleColumn/(COLS-1))*100;const y=(row/(IDLE_FRAMES-1))*100;element.style.backgroundPosition=`${x}% ${y}%`;}
function idleLoop(now){const row=Math.floor(((now%IDLE_DURATION)/IDLE_DURATION)*IDLE_FRAMES);if(row!==lastRow){showFrame(row);lastRow=row;}requestAnimationFrame(idleLoop);}
showFrame(0);requestAnimationFrame(idleLoop);
</script>
</body>
</html>
